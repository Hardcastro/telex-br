name: Ciclo Telex BR (12h) — manual

# O gatilho automático de 12h saiu daqui: a conta do GitHub ficou com o
# Actions bloqueado por faturamento, então o cron de verdade agora é
# externo (cron-job.org) batendo num endpoint no Render — ver
# web/app.py e README, "Gatilho de 12h via Render". Este workflow fica só
# como forma manual de rodar um ciclo pela aba Actions, e volta a fazer
# sentido como cron se/quando o Actions da conta for destravado (é só
# devolver o bloco `schedule:` removido daqui, com cron "0 3,15 * * *").
on:
  workflow_dispatch: {}

permissions:
  contents: write  # necessário para commitar data/cycles/latest.{json,csv} de volta

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar o pipeline
        env:
          # Descomente e configure em Settings > Secrets se for usar o
          # proxy de réplica via Reddit (ver .env.example).
          # REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          # REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          PYTHONIOENCODING: "utf-8"
        run: python -m src.pipeline

      - name: Commitar o ciclo mais recente
        run: |
          git config user.name "telex-br-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cycles/latest.json data/cycles/latest.csv
          git diff --cached --quiet || git commit -m "ciclo: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
