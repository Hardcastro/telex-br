# Blueprint do Render (render.com/docs/blueprint-spec). No dashboard:
# New > Blueprint > conecte o repo telex-br > o Render lê este arquivo
# sozinho e propõe o serviço abaixo — só falta você preencher as env vars
# marcadas "sync: false" (ver README, seção "Gatilho de 12h via Render").
services:
  - type: web
    name: telex-br-trigger
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt -r requirements-web.txt"
    startCommand: "python -m web.app"
    buildFilter:
      # Sem isso, cada ciclo commitava data/cycles/latest.{json,csv} de
      # volta no repo (ver web/github_sync.py) e o auto-deploy do Render
      # redeployava o servico em cima disso -- 2 redeploys por ciclo, a
      # cada 12h, so por causa de um arquivo de dados que nao muda o
      # codigo. Foi a causa raiz de dias de falha silenciosa do gatilho
      # (o servico ficava instavel demais entre um redeploy e outro pra
      # responder ao cron-job.org a tempo). Configurado primeiro pelo
      # painel do Render, replicado aqui pra sobreviver a um re-sync do
      # blueprint.
      ignoredPaths:
        - data/cycles/**
    envVars:
      - key: RUN_TOKEN
        sync: false   # gere um valor aleatório qualquer — é a "senha" do endpoint
      - key: GITHUB_TOKEN
        sync: false   # personal access token com escopo "repo" (contents: write)
      - key: GITHUB_REPO
        value: Hardcastro/telex-br
